name: CatVod A方案 生成可播放M3U
on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 北京时间10点每日自动执行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 最大5小时超时
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整git历史，用于提交

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          npm init -y || true
          npm install node-fetch

      - name: Run A方案脚本，生成m3u
        run: node scripts/cat-a-full-stream.mjs

      - name: Upload artifact备份
        uses: actions/upload-artifact@v4
        with:
          name: cat-A-playable-m3u
          path: ./cat-A-可播放.m3u
          if-no-files-found: error
          retention-days: 7

      - name: Commit & Push m3u back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cat-A-可播放.m3u
          git commit -m "auto: update cat-A m3u $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
